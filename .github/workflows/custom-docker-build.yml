name: Publish custom Docker image

# Manual build for a fork. Pushes <DOCKERHUB_USERNAME>/new-api:<version> and :latest
# for linux/amd64. Triggered only by workflow_dispatch so tag pushes keep using the
# upstream workflow semantics.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build'
        required: true
        default: 'feat/content-moderation'
        type: string
      version:
        description: 'Image version tag, also written to VERSION (e.g. v1.0.0-rc.46-cm.1)'
        required: true
        type: string
      push_latest:
        description: 'Also tag the image as latest'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build & push (linux/amd64)
    if: github.repository != 'QuantumNous/new-api'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - name: Validate version & write VERSION
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Invalid version '$VERSION'"
            exit 1
          fi
          echo "$VERSION" > VERSION

      - name: Resolve own Docker Hub image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Secret DOCKERHUB_USERNAME is not set"
            exit 1
          fi
          if [ "$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')" = "calciumion" ]; then
            echo "::error::Refusing to push to the upstream calciumion namespace"
            exit 1
          fi
          echo "IMAGE=${DOCKERHUB_USERNAME}/new-api" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE}:${VERSION}"
            if [ "$PUSH_LATEST" = "true" ]; then echo "${IMAGE}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "### Docker image"
            echo '```'
            echo "${IMAGE}:${VERSION}"
            echo "${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
